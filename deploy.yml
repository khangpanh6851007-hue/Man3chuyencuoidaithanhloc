name: Deploy static content to GitHub Pages

on:
  push:
    branches: ["main"] # Thay đổi thành 'master' nếu branch mặc định của bạn là master

  # Cho phép kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Thiết lập quyền hạn cho GITHUB_TOKEN để triển khai lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một tiến trình triển khai chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên gói dữ liệu (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ định thư mục chứa file index.html (thư mục gốc '.')
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
